<script>
const COLORS = ['#06b6d4','#8b5cf6','#10b981','#f97316','#f59e0b','#ec4899','#3b82f6','#ef4444','#84cc16','#a855f7']
let engine='chartjs', chartType='bar', chartInst=null, echartsInst=null, importedData=null

function parse(s){return s.split(',').map(x=>x.trim()).filter(Boolean)}
function parseNums(s){return s.split(',').map(x=>parseFloat(x.trim())).filter(n=>!isNaN(n))}
function g(id){return document.getElementById(id)}

function setEngine(eng,btn){
  engine=eng
  document.querySelectorAll('.et').forEach(t=>t.classList.remove('active')); btn.classList.add('active')
  g('sb-engine').textContent={chartjs:'Chart.js v4',echarts:'Apache ECharts v5',plotly:'Plotly.js',d3:'D3.js',dashboard:'Dashboard'}[eng]
  const els=['chartjs-canvas','echarts-div','plotly-div','d3-div','dashboard-view']
  els.forEach(id=>g(id).style.display='none')
  const show={chartjs:'chartjs-canvas',echarts:'echarts-div',plotly:'plotly-div',d3:'d3-div',dashboard:'dashboard-view'}[eng]||''
  if(show) g(show).style.display=['chartjs-canvas'].includes(show)?'block':'block'
  if(eng==='dashboard') renderDashboard()
  else update()
}

function setType(t,el){
  chartType=t
  document.querySelectorAll('.ct').forEach(c=>c.classList.remove('active'))
  el.classList.add('active')
  g('sb-type').textContent=t
  update()  // update() handles engine routing internally
}

function getData(){
  const labels=parse(g('labels').value)
  const d1=parseNums(g('ds1').value), d2=parseNums(g('ds2').value)
  const d1n=g('ds1n').value, d2n=g('ds2n').value
  const c1=g('ds1c').value, c2=g('ds2c').value
  return{labels,d1,d2,d1n,d2n,c1,c2}
}

function update(){
  if(engine==='dashboard'){renderDashboard();return}
  const{labels,d1,d2,d1n,d2n,c1,c2}=getData()
  g('sb-points').textContent=`${d1.length} data points`
  g('chart-info').textContent=`${labels.length} labels · ${d2.length?2:1} dataset${d2.length?'s':''}`

  // Route to correct engine based on chart type compatibility
  const chartjsTypes=['bar','line','pie','doughnut','radar','scatter','bubble','polarArea','area']
  const echartsOnly=['gauge','heatmap','treemap']

  if(echartsOnly.includes(chartType)){
    // Force ECharts for gauge/heatmap/treemap
    if(engine!=='echarts'){
      engine='echarts'
      document.querySelectorAll('.et').forEach(x=>x.classList.remove('active'))
      const eBtn=Array.from(document.querySelectorAll('.et')).find(b=>b.textContent.includes('ECharts'))
      if(eBtn)eBtn.classList.add('active')
      g('sb-engine').textContent='Apache ECharts v5'
      g('chartjs-canvas').style.display='none'
      g('plotly-div').style.display='none'
      g('d3-div').style.display='none'
      g('dashboard-view').style.display='none'
      g('echarts-div').style.display='block'
      if(chartInst){try{chartInst.destroy()}catch(e){}chartInst=null}
    }
    renderECharts(labels,d1,d2,d1n,d2n,c1,c2)
  } else if(engine==='chartjs'){
    renderChartJS(labels,d1,d2,d1n,d2n,c1,c2)
  } else if(engine==='echarts'){
    renderECharts(labels,d1,d2,d1n,d2n,c1,c2)
  } else if(engine==='plotly'){
    renderPlotly(labels,d1,d2,d1n,d2n,c1,c2)
  } else if(engine==='d3'){
    renderD3(labels,d1,d2,d1n,d2n,c1,c2)
  }
}

function renderChartJS(labels,d1,d2,d1n,d2n,c1,c2){
  // Destroy existing instance properly
  if(chartInst){
    try{chartInst.destroy()}catch(e){}
    chartInst=null
  }
  // Replace canvas element to guarantee clean slate
  const wrap = g('chartjs-canvas').parentElement
  const oldCanvas = g('chartjs-canvas')
  const newCanvas = document.createElement('canvas')
  newCanvas.id = 'chartjs-canvas'
  newCanvas.style.maxWidth = '100%'
  newCanvas.style.maxHeight = '100%'
  wrap.replaceChild(newCanvas, oldCanvas)

  const title=g('chart-title').value
  const legend=g('show-legend').checked, smooth=g('smooth').checked
  const fill=g('fill-area').checked, anim=g('animation').checked
  const isPolar=['pie','doughnut','polarArea'].includes(chartType)
  const isRadar=chartType==='radar'
  const isScatter=chartType==='scatter'
  const isBubble=chartType==='bubble'
  const bgColors=COLORS.slice(0,labels.length).map(c=>c+'bb')

  // For scatter/bubble: convert simple arrays to {x,y} pairs
  let chartDataType = chartType
  let datasets

  if(isScatter){
    // Scatter: x=index, y=value
    chartDataType='scatter'
    datasets=[{
      label:d1n,
      data:d1.map((v,i)=>({x:i,y:v})),
      backgroundColor:c1+'cc',
      borderColor:c1,
      borderWidth:2,
      pointRadius:5,
    }]
    if(d2.length){
      datasets.push({
        label:d2n,
        data:d2.map((v,i)=>({x:i,y:v})),
        backgroundColor:c2+'cc',
        borderColor:c2,
        borderWidth:2,
        pointRadius:5,
      })
    }
  } else if(isBubble){
    // Bubble: x=index, y=value, r=scaled value
    chartDataType='bubble'
    const maxVal=Math.max(...d1,...d2,1)
    datasets=[{
      label:d1n,
      data:d1.map((v,i)=>({x:i,y:v,r:Math.max(3,(v/maxVal)*20)})),
      backgroundColor:c1+'66',
      borderColor:c1,
      borderWidth:2,
    }]
    if(d2.length){
      datasets.push({
        label:d2n,
        data:d2.map((v,i)=>({x:i,y:v,r:Math.max(3,(v/maxVal)*20)})),
        backgroundColor:c2+'66',
        borderColor:c2,
        borderWidth:2,
      })
    }
  } else {
    // Standard bar/line/pie/doughnut/radar/polarArea/area
    chartDataType=chartType==='area'?'line':chartType
    datasets=[{
      label:d1n,data:d1,
      backgroundColor:isPolar||isRadar?bgColors:c1+'cc',
      borderColor:isPolar||isRadar?COLORS.slice(0,labels.length):c1,
      borderWidth:2,fill:fill||chartType==='area',tension:smooth?.4:0,pointRadius:3,
    }]
    if(d2.length&&!isPolar&&!isRadar) datasets.push({label:d2n,data:d2,backgroundColor:c2+'cc',borderColor:c2,borderWidth:2,fill:false,tension:smooth?.4:0,pointRadius:3})
  }

  // Scatter and bubble need linear X axis, not category
  const needsLinearX = isScatter || isBubble

  chartInst=new Chart(newCanvas.getContext('2d'),{
    type:chartDataType,data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:true,animation:{duration:anim?500:0},
      plugins:{legend:{display:legend,labels:{color:'#a8b5cc',font:{size:12}}},title:{display:!!title,text:title,color:'#f0f4ff',font:{size:15,weight:'bold'}}},
      scales:(isPolar||isRadar)?{}:needsLinearX?{
        x:{type:'linear',position:'bottom',ticks:{color:'#64748b'},grid:{color:'rgba(255,255,255,.04)'}},
        y:{ticks:{color:'#64748b'},grid:{color:'rgba(255,255,255,.06)'}},
      }:{
        x:{ticks:{color:'#64748b'},grid:{color:'rgba(255,255,255,.04)'},title:{display:!!g('x-label').value,text:g('x-label').value,color:'#64748b'}},
        y:{ticks:{color:'#64748b'},grid:{color:'rgba(255,255,255,.06)'},title:{display:!!g('y-label').value,text:g('y-label').value,color:'#64748b'}},
      }
    }
  })
}

function renderECharts(labels,d1,d2,d1n,d2n,c1,c2){
  const el=g('echarts-div')
  // Dispose and recreate when switching between chart families
  // to avoid axis/series conflicts
  if(echartsInst){
    echartsInst.dispose()
    echartsInst=null
  }
  echartsInst=echarts.init(el,'dark',{backgroundColor:'#090c13'})
  const anim=g('animation').checked
  const title=g('chart-title').value
  const isPolar=chartType==='pie'
  const isGauge=chartType==='gauge'
  const isTreemap=chartType==='treemap'
  const isHeatmap=chartType==='heatmap'

  let option
  if(isGauge){
    // Gauge: uses first data point as percentage
    const val = d1[0] !== undefined ? Math.min(100, Math.max(0, d1[0])) : 65
    option={
      backgroundColor:'#090c13',
      title:{text:title,textStyle:{color:'#f0f4ff',fontSize:14},top:8,left:'center'},
      series:[{
        type:'gauge',
        startAngle:180,endAngle:0,
        min:0,max:d1.reduce((a,b)=>Math.max(a,b),100)||100,
        data:[{value:val,name:d1n}],
        axisLine:{lineStyle:{width:24,color:[[.3,'#ef4444'],[.7,'#f59e0b'],[1,'#10b981']]}},
        pointer:{itemStyle:{color:'auto'}},
        axisTick:{distance:-24,splitNumber:5,lineStyle:{color:'#fff',width:2}},
        splitLine:{distance:-32,length:14,lineStyle:{color:'#fff',width:3}},
        axisLabel:{color:'#a8b5cc',fontSize:12,distance:-52},
        detail:{valueAnimation:true,formatter:'{value}',color:'auto',fontSize:24,fontWeight:'bold',offsetCenter:[0,'10%']},
        title:{color:'#a8b5cc',offsetCenter:[0,'40%'],fontSize:14},
      }]
    }
  } else if(isTreemap){
    option={
      backgroundColor:'#090c13',
      title:{text:title,textStyle:{color:'#f0f4ff',fontSize:14},top:8,left:'center'},
      tooltip:{formatter:'{b}: {c}'},
      series:[{
        type:'treemap',
        data:labels.map((l,i)=>({name:l,value:d1[i]||0})),
        levels:[{itemStyle:{borderColor:'#090c13',borderWidth:3,gapWidth:2}},{itemStyle:{borderColor:'rgba(255,255,255,.1)',borderWidth:2,gapWidth:1}}],
      }]
    }
  } else if(isHeatmap){
    // Simple heatmap using first dataset as a matrix
    const size=Math.ceil(Math.sqrt(d1.length))
    const data=d1.map((v,i)=>[i%size,Math.floor(i/size),v||0])
    const maxV=Math.max(...d1,1)
    option={
      backgroundColor:'#090c13',
      title:{text:title,textStyle:{color:'#f0f4ff',fontSize:14},top:8,left:'center'},
      tooltip:{position:'top'},
      visualMap:{min:0,max:maxV,calculable:true,orient:'horizontal',left:'center',bottom:'3%',textStyle:{color:'#a8b5cc'},inRange:{color:['#1a2235','#06b6d4','#f97316']}},
      grid:{top:'15%',left:'3%',right:'4%',bottom:'12%',containLabel:true},
      xAxis:{type:'category',data:labels.slice(0,size),axisLabel:{color:'#64748b'}},
      yAxis:{type:'category',data:Array.from({length:size},(v,i)=>String(i+1)),axisLabel:{color:'#64748b'}},
      series:[{type:'heatmap',data,label:{show:true,fontSize:9},emphasis:{itemStyle:{shadowBlur:10,shadowColor:'rgba(0,0,0,.5)'}}}]
    }
  } else {
    const seriesMap={
      bar:{type:'bar'},line:{type:'line',smooth:g('smooth').checked},
      scatter:{type:'scatter'},area:{type:'line',smooth:true,areaStyle:{opacity:.25}},
      polarArea:{type:'bar',coordinateSystem:'polar'},
      doughnut:{type:'pie',radius:['40%','70%']},
      radar:{type:'radar'},
    }
    const serType=seriesMap[chartType]||{type:'bar'}
    const series=[{...serType,name:d1n,data:isPolar?labels.map((l,i)=>({name:l,value:d1[i]})):d1,itemStyle:{color:c1}}]
    if(d2.length&&!isPolar) series.push({...serType,name:d2n,data:d2,itemStyle:{color:c2}})
    option={
      backgroundColor:'#090c13',animation:anim,animationDuration:600,
      title:{text:title,textStyle:{color:'#f0f4ff',fontSize:14},top:8,left:'center'},
      tooltip:{trigger:'axis',backgroundColor:'#1a2235',borderColor:'rgba(255,255,255,.1)',textStyle:{color:'#f0f4ff'}},
      legend:{show:g('show-legend').checked,textStyle:{color:'#a8b5cc'},bottom:4},
      grid:{left:'3%',right:'4%',bottom:'12%',top:'14%',containLabel:true},
      xAxis:{type:'category',data:labels,axisLabel:{color:'#64748b'},axisLine:{lineStyle:{color:'rgba(255,255,255,.07)'}},splitLine:{lineStyle:{color:'rgba(255,255,255,.04)'}}},
      yAxis:{type:'value',name:g('y-label').value,nameTextStyle:{color:'#64748b'},axisLabel:{color:'#64748b'},splitLine:{lineStyle:{color:'rgba(255,255,255,.05)'}}},
      series,
    }
  }
  echartsInst.setOption(option)
  window.addEventListener('resize',()=>echartsInst?.resize())
}

function renderPlotly(labels,d1,d2,d1n,d2n,c1,c2){
  const el=g('plotly-div')
  const typeMap={bar:'bar',line:'scatter',pie:'pie',scatter:'scatter',area:'scatter'}
  const mode={bar:undefined,line:'lines+markers',scatter:'markers',area:'lines',pie:undefined}
  const fill={area:'tozeroy'}
  const traces=[{
    x:chartType==='pie'?labels:labels,y:chartType==='pie'?d1:d1,
    type:typeMap[chartType]||'bar',mode:mode[chartType],fill:fill[chartType],
    name:d1n,marker:{color:c1},line:{color:c1,width:2},
    ...(chartType==='pie'?{labels:labels,values:d1,hole:.4}:{})
  }]
  if(d2.length&&chartType!=='pie') traces.push({x:labels,y:d2,type:typeMap[chartType]||'bar',mode:mode[chartType],name:d2n,marker:{color:c2},line:{color:c2,width:2}})
  Plotly.newPlot(el,traces,{
    title:{text:g('chart-title').value,font:{color:'#f0f4ff',size:14}},
    paper_bgcolor:'#090c13',plot_bgcolor:'#0d1117',
    font:{color:'#a8b5cc',size:11},
    legend:{font:{color:'#a8b5cc'}},
    xaxis:{color:'#64748b',gridcolor:'rgba(255,255,255,.05)',title:g('x-label').value},
    yaxis:{color:'#64748b',gridcolor:'rgba(255,255,255,.05)',title:g('y-label').value},
    margin:{t:50,b:50,l:60,r:20},
  },{responsive:true,displayModeBar:true})
}

function renderD3(labels,d1,d2,d1n,d2n,c1,c2){
  const el=g('d3-div'); el.innerHTML=''
  // Load D3 on demand
  if(!window.d3){
    const s=document.createElement('script'); s.src='https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js'
    s.onload=()=>renderD3(labels,d1,d2,d1n,d2n,c1,c2)
    document.head.appendChild(s); return
  }
  const W=el.offsetWidth||600, H=el.offsetHeight||400
  const margin={top:40,right:30,bottom:50,left:60}
  const iw=W-margin.left-margin.right, ih=H-margin.top-margin.bottom
  const svg=d3.select(el).append('svg').attr('width',W).attr('height',H)
  const g2=svg.append('g').attr('transform',`translate(${margin.left},${margin.top})`)
  const x=d3.scaleBand().domain(labels).range([0,iw]).padding(.2)
  const y=d3.scaleLinear().domain([0,d3.max([...d1,...d2.filter(Boolean)])*1.1]).range([ih,0])
  g2.append('g').attr('transform',`translate(0,${ih})`).call(d3.axisBottom(x)).selectAll('text').style('fill','#64748b').style('font-size','11px')
  g2.append('g').call(d3.axisLeft(y).ticks(5)).selectAll('text').style('fill','#64748b').style('font-size','11px')
  g2.selectAll('.domain,.tick line').style('stroke','rgba(255,255,255,.1)')
  const bw=d2.length?x.bandwidth()/2:x.bandwidth()
  g2.selectAll('.bar1').data(d1).enter().append('rect').attr('x',(_,i)=>x(labels[i])).attr('y',d=>y(d)).attr('width',bw).attr('height',d=>ih-y(d)).attr('fill',c1).attr('opacity',.85).attr('rx',3)
  if(d2.length) g2.selectAll('.bar2').data(d2).enter().append('rect').attr('x',(_,i)=>x(labels[i])+bw).attr('y',d=>y(d)).attr('width',bw).attr('height',d=>ih-y(d)).attr('fill',c2).attr('opacity',.85).attr('rx',3)
  svg.append('text').attr('x',W/2).attr('y',22).attr('text-anchor','middle').style('fill','#f0f4ff').style('font-size','14px').style('font-weight','bold').text(g('chart-title').value)
}

  new Chart(g('dc3').getContext('2d'),{type:'pie',data:{labels,datasets:[{data:d1,backgroundColor:COLORS.slice(0,labels.length).map(c=>c+'bb'),borderWidth:2}]},options:{...opts,maintainAspectRatio:false,scales:{}}})
  new Chart(g('dc4').getContext('2d'),{type:'radar',data:{labels,datasets:[{label:d1n,data:d1,backgroundColor:c1+'33',borderColor:c1,borderWidth:2}]},options:{...opts,maintainAspectRatio:false,scales:{}}})

// -- CSV IMPORT ---------------------------------------------
function importCSV(file){
  if(!file) return
  const reader=new FileReader()
  reader.onload=e=>{
    const lines=e.target.result.split('\n').filter(l=>l.trim())
    if(lines.length<2){toast('CSV needs at least 2 rows','err');return}
    const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''))
    const rows=lines.slice(1).map(l=>l.split(',').map(v=>v.trim().replace(/^"|"$/g,'')))
    const labels=rows.map(r=>r[0]).filter(Boolean)
    const d1=rows.map(r=>parseFloat(r[1])).filter(n=>!isNaN(n))
    const d2=rows.map(r=>parseFloat(r[2])).filter(n=>!isNaN(n))
    g('labels').value=labels.join(',')
    g('ds1').value=d1.join(','); if(headers[1]) g('ds1n').value=headers[1]
    g('ds2').value=d2.join(','); if(headers[2]) g('ds2n').value=headers[2]
    g('import-status').textContent=`? ${file.name}: ${labels.length} rows, ${headers.length-1} series`
    g('import-status').style.color='var(--green)'
    toast(`CSV imported: ${labels.length} rows`,'ok')
    update()
  }
  reader.readAsText(file)
}

function pasteJSON(){
  const json=prompt('Paste JSON data (array of objects or {labels,datasets}):')
  if(!json) return
  try{
    const data=JSON.parse(json)
    if(data.labels&&data.datasets){
      g('labels').value=data.labels.join(',')
      g('ds1').value=data.datasets[0].data.join(',')
      if(data.datasets[0].label) g('ds1n').value=data.datasets[0].label
      if(data.datasets[1]){g('ds2').value=data.datasets[1].data.join(',');if(data.datasets[1].label) g('ds2n').value=data.datasets[1].label}
      toast('JSON imported','ok'); update()
    } else if(Array.isArray(data)){
      const keys=Object.keys(data[0])
      g('labels').value=data.map(r=>r[keys[0]]).join(',')
      g('ds1').value=data.map(r=>r[keys[1]]).join(',')
      if(keys[2]) g('ds2').value=data.map(r=>r[keys[2]]).join(',')
      toast(`JSON imported: ${data.length} rows`,'ok'); update()
    }
  }catch{toast('Invalid JSON','err')}
}

function copyConfig(){
  const cfg={type:chartType,labels:parse(g('labels').value),datasets:[{label:g('ds1n').value,data:parseNums(g('ds1').value),color:g('ds1c').value}]}
  if(parseNums(g('ds2').value).length) cfg.datasets.push({label:g('ds2n').value,data:parseNums(g('ds2').value),color:g('ds2c').value})
  navigator.clipboard.writeText(JSON.stringify(cfg,null,2)).then(()=>toast('Config copied','ok'))
}

function downloadPNG(){
  const canvas=document.getElementById('chartjs-canvas')
  if(engine==='chartjs'&&canvas&&g('chartjs-canvas').style.display!=='none'){
    const a=document.createElement('a'); a.download='chart.png'; a.href=canvas.toDataURL('image/png',1); a.click()
  } else if(engine==='echarts'&&echartsInst){
    const a=document.createElement('a'); a.download='chart.png'; a.href=echartsInst.getDataURL({type:'png',pixelRatio:2,backgroundColor:'#090c13'}); a.click()
  } else if(engine==='plotly'){
    Plotly.downloadImage(g('plotly-div'),{format:'png',width:1200,height:800,filename:'chart'})
  } else { toast('Switch to Chart.js or ECharts for PNG export','info'); return }
  toast('Chart downloaded','ok')
}

window.addEventListener('resize',()=>echartsInst?.resize())

function toast(msg,type=''){
  const el=document.createElement('div'); el.className='toast'+(type?' '+type:''); el.textContent=msg
  g('toasts').appendChild(el); setTimeout(()=>el.remove(),2800)
}
