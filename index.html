</header>

<main class="main">
  <aside class="controls">
    <div>
      <p class="section-title">Chart Type</p>
      <div class="type-grid" style="margin-top:.5rem">
        <div class="type-btn active" onclick="setType('bar',this)">Bar</div>
        <div class="type-btn" onclick="setType('line',this)">Line</div>
        <div class="type-btn" onclick="setType('pie',this)">Pie</div>
        <div class="type-btn" onclick="setType('doughnut',this)">Ring</div>
        <div class="type-btn" onclick="setType('radar',this)">Radar</div>
      </div>
    </div>
    <div><label>Chart Title</label><input type="text" id="title" value="Monthly Sales" oninput="update()"></div>
    <div><label>Labels (comma-separated)</label><textarea id="labels" oninput="update()">Jan, Feb, Mar, Apr, May, Jun</textarea></div>
    <div><label>Dataset 1 Name</label><input type="text" id="ds1name" value="Revenue ($k)" oninput="update()"></div>
    <div><label>Dataset 1 Values (comma-separated)</label><textarea id="ds1" oninput="update()">42, 78, 55, 91, 63, 84</textarea></div>
    <div><label>Dataset 1 Colour</label><input type="color" id="ds1color" value="#3b82f6" oninput="update()"></div>
    <div id="ds2section">
      <label>Dataset 2 Name (optional)</label><input type="text" id="ds2name" value="Target ($k)" oninput="update()" style="margin-bottom:.4rem">
      <label>Dataset 2 Values</label><textarea id="ds2" oninput="update()">50, 65, 60, 80, 75, 90</textarea>
      <div style="margin-top:.4rem"><label>Dataset 2 Colour</label><input type="color" id="ds2color" value="#06b6d4" oninput="update()"></div>
    </div>
  </aside>
  <div class="chart-area">
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>
</main>

<div class="ad-slot" aria-label="Advertisement">

<script>
const COLORS = ['#3b82f6','#06b6d4','#8b5cf6','#10b981','#f59e0b','#ec4899','#f97316','#ef4444']
let chartType = 'bar'
let chartInst = null

function parse(str) { return str.split(',').map(s => s.trim()).filter(Boolean) }
function parseNums(str) { return str.split(',').map(s => parseFloat(s.trim())).filter(n => !isNaN(n)) }

function setType(t, btn) {
  chartType = t
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'))
  btn.classList.add('active')
  const isPolar = t === 'pie' || t === 'doughnut' || t === 'radar'
  document.getElementById('ds2section').style.display = isPolar ? 'none' : ''
  update()
}

function update() {
  const labels = parse(document.getElementById('labels').value)
  const d1 = parseNums(document.getElementById('ds1').value)
  const d2 = parseNums(document.getElementById('ds2').value)
  const title = document.getElementById('title').value
  const c1 = document.getElementById('ds1color').value
  const c2 = document.getElementById('ds2color').value
  const isPolar = chartType === 'pie' || chartType === 'doughnut' || chartType === 'radar'

  const datasets = [{
    label: document.getElementById('ds1name').value,
    data: d1,
    backgroundColor: isPolar ? COLORS.slice(0, labels.length).map(c => c + 'bb') : c1 + 'cc',
    borderColor: isPolar ? COLORS.slice(0, labels.length) : c1,
    borderWidth: 2, fill: chartType === 'line', tension: 0.4, pointRadius: chartType === 'line' ? 4 : 3,
  }]

  if (!isPolar && d2.length) {
    datasets.push({
      label: document.getElementById('ds2name').value,
      data: d2, backgroundColor: c2 + 'cc', borderColor: c2,
      borderWidth: 2, fill: false, tension: 0.4, pointRadius: 4,
    })
  }

  if (chartInst) chartInst.destroy()
  chartInst = new Chart(document.getElementById('chart'), {
    type: chartType,
    data: { labels, datasets },
    options: {
      responsive: true,
      plugins: {
        legend: { labels: { color: '#e6edf3', font: { size: 12 } } },
        title: { display: !!title, text: title, color: '#e6edf3', font: { size: 15, weight: 'bold' } },
      },
      scales: isPolar ? {} : {
        x: { ticks: { color: '#8b949e' }, grid: { color: 'rgba(255,255,255,.05)' } },
        y: { ticks: { color: '#8b949e' }, grid: { color: 'rgba(255,255,255,.07)' } },
      },
    },
  })
}

function downloadChart() {
  const a = document.createElement('a')
  a.download = 'chart.png'
  a.href = document.getElementById('chart').toDataURL('image/png')
  a.click()
}

update()
</script>
